services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: cnams
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: cnams
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cnams -d cnams"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://cnams:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/cnams
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ADMIN_ENROLMENT_CODE: ${ADMIN_ENROLMENT_CODE:?set code}
      NAME_ENC_KEY: ${NAME_ENC_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
volumes:
  pgdata:
